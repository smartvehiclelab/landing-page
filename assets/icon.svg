<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-140" y="-140" width="280" height="280" rx="64" fill="none" stroke="url(#ringGrad)" stroke-width="26" opacity="0.35" filter="url(#glow)" />
    <!-- Sharp Foreground Diamond Ring (Matching .logo-ring) -->
    <rect x="-140" y="-140" width="280" height="280" rx="64" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linejoin="round" />
  </g>

  <!-- Center Edge AI Sensor & Rover Optical Node -->
  <!-- Central Glowing AI Aperture -->
  <circle cx="256" cy="256" r="44" fill="url(#coreGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="#030712" stroke="url(#ringGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />

  <!-- Horizon Telemetry Radar Ticks -->
  <line x1="168" y1="256" x2="198" y2="256" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="314" y1="256" x2="344" y2="256" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="168" x2="256" y2="198" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="314" x2="256" y2="344" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8" />
</svg>
